:root{--surface:#ffffff;--line:#e6e6e8;--ink:#1e1e20;--ink-mid:#45454a;--ink-soft:#6e6e73;--ink-faint:#a1a1a6;

  --bg:#ffffff;--bg-soft:#f5f5f6;--sh-card:0 2px 10px rgba(30,30,32,.05);--sans:'DM Sans',system-ui,sans-serif;color-scheme:light}
:root[data-theme="dark"]{--surface:#1f1f23;--line:#2e2e34;--ink:#ececee;--ink-mid:#c8c8cd;--ink-soft:#9b9ba2;--ink-faint:#6b6b72;
  --red:#c8545b;--red-dark:#8e2f35;--red-deep:#6e252a;--red-pale:#2a1c1e;--red-bd:#4b2e31;--bn-bg1:#1c1c20;--bn-bg2:#18181b;
  --bg:#141416;--bg-soft:#1b1b1e;--sh-card:0 2px 10px rgba(0,0,0,.3);color-scheme:dark}
html,body{background:var(--bg);transition:background .3s ease}
/* ── SWITCH MODO CLARO / OSCURO ── */
.theme-switch {
  position:fixed; top:16px; right:16px; z-index:120;
  display:inline-flex; align-items:center; gap:10px;
  padding:6px 12px 6px 6px; border-radius:100px;
  background:var(--surface); border:1px solid var(--line); box-shadow:var(--sh-card);
  font-family:var(--sans); font-size:12px; font-weight:600; color:var(--ink-mid);
  cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.theme-switch:focus-visible { outline:2px solid var(--red); outline-offset:2px; }
.ts-track {
  position:relative; width:44px; height:24px; border-radius:100px;
  background:var(--bg-soft); border:1px solid var(--line); flex-shrink:0;
  transition:background .25s ease;
}
.ts-knob {
  position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
  background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center;
  transition:transform .25s ease;
}
.ts-knob svg { width:11px; height:11px; }
.ts-moon, .ts-lbl-light { display:none; }
:root[data-theme="dark"] .ts-knob { transform:translateX(20px); }
:root[data-theme="dark"] .ts-sun, :root[data-theme="dark"] .ts-lbl-dark { display:none; }
:root[data-theme="dark"] .ts-moon, :root[data-theme="dark"] .ts-lbl-light { display:inline; }

</style>

</button>

<script>
function baToggleTheme(){
  var d = document.documentElement, dark = d.getAttribute('data-theme') !== 'dark';
  if (dark) d.setAttribute('data-theme', 'dark'); else d.removeAttribute('data-theme');
  try { localStorage.setItem('ba-tema', dark ? 'dark' : 'light'); } catch (e) {}
  baSyncSwitch();
}
function baSyncSwitch(){
  var on = document.documentElement.getAttribute('data-theme') === 'dark';
  document.querySelectorAll('.theme-switch').forEach(function (b) { b.setAttribute('aria-checked', on ? 'true' : 'false'); });
}
baSyncSwitch();
</script>
